name: NEURO//SCAN

on:
  push:
    paths: ["neuroscan/**", ".github/workflows/neuroscan.yml"]
  pull_request:
    paths: ["neuroscan/**", ".github/workflows/neuroscan.yml"]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Desplegar a Cloudflare después de las pruebas"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: neuroscan-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: neuroscan

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: neuroscan/package-lock.json
      - run: npm ci
      - name: Validar banco de preguntas
        run: npm run validate
      - name: Pruebas unitarias e integración (motor, API, push)
        run: npm test
      - name: Build web + archivo único
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: neuroscan-app-html
          path: neuroscan/dist/standalone/neuroscan-app.html

  e2e:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: neuroscan/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Pruebas de extremo a extremo (Worker local + Chromium)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: neuroscan/test-results/
          retention-days: 7

  deploy:
    needs: [test, e2e]
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: neuroscan/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Migraciones D1
        run: npx wrangler d1 migrations apply neuroscan --remote
      - name: Desplegar Worker
        run: npx wrangler deploy
