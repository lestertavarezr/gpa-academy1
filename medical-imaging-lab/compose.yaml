services:
  orthanc:
    image: orthancteam/orthanc:25.10.2
    environment:
      DICOM_WEB_PLUGIN_ENABLED: "true"
      ORTHANC__DICOM_WEB__ROOT: "/dicom-web/"
      ORTHANC__REMOTE_ACCESS_ALLOWED: "true"
      ORTHANC__AUTHENTICATION_ENABLED: "true"
      ORTHANC__REGISTERED_USERS: '{"gpa":"${ORTHANC_PASSWORD:?Set ORTHANC_PASSWORD}"}'
      ORTHANC__DICOM_AET: "GPADEMO"
    volumes:
      - orthanc-data:/var/lib/orthanc/db
    ports:
      - "127.0.0.1:8042:8042"
    networks: [private]
  ohif:
    image: ohif/app:v3.12.18
    volumes:
      - ./viewer/app-config.js:/usr/share/nginx/html/app-config.js:ro
    networks: [private]
  gateway:
    image: nginx:1.29-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: [ohif, orthanc]
    networks: [private]
networks:
  private:
volumes:
  orthanc-data:
