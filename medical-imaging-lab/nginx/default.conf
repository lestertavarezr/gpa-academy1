server {
  listen 80;
  server_name localhost;
  client_max_body_size 1m;
  location /lab/ { proxy_pass http://host.docker.internal:8788; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; }
  location /api/lab/ { proxy_pass http://host.docker.internal:8788; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; }
  location /dicomweb/ { proxy_pass http://host.docker.internal:8788; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; proxy_buffering off; }
  location / { proxy_pass http://ohif:80; proxy_set_header Host $host; }
}
