services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tradinghub
    ports:
      - "5432:5432"
    volumes:
      - tradinghub_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot-engine:
    build: ./bot-engine
    image: tradinghub-bot-engine:local
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      BINANCE_TESTNET_API_KEY: ${BINANCE_TESTNET_API_KEY:-}
      BINANCE_TESTNET_API_SECRET: ${BINANCE_TESTNET_API_SECRET:-}
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tradinghub
      CELERY_BROKER_URL: redis://redis:6379/1
      PAPER_BOT_TICK_SECONDS: ${PAPER_BOT_TICK_SECONDS:-60}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Ejecuta los bots de paper trading (Fase 4). Misma imagen que bot-engine,
  # solo cambia el comando — asi el codigo nunca se duplica entre las dos.
  celery-worker:
    image: tradinghub-bot-engine:local
    restart: unless-stopped
    command: celery -A app.celery_app worker -B --loglevel=info
    # El HEALTHCHECK de la imagen chequea el puerto 8000 (uvicorn), que este
    # contenedor no expone — lo desactivamos para no marcarlo "unhealthy" por
    # error. La recuperacion ante crashes la sigue dando `restart: unless-stopped`.
    healthcheck:
      disable: true
    environment:
      BINANCE_TESTNET_API_KEY: ${BINANCE_TESTNET_API_KEY:-}
      BINANCE_TESTNET_API_SECRET: ${BINANCE_TESTNET_API_SECRET:-}
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tradinghub
      CELERY_BROKER_URL: redis://redis:6379/1
      PAPER_BOT_TICK_SECONDS: ${PAPER_BOT_TICK_SECONDS:-60}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      bot-engine:
        condition: service_started

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      BOT_ENGINE_URL: http://bot-engine:8000
      PORT: 3001
      REDIS_URL: redis://redis:6379
      SIGNAL_CACHE_TTL_SECONDS: ${SIGNAL_CACHE_TTL_SECONDS:-180}
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tradinghub
      JWT_SECRET: ${JWT_SECRET:?Definir JWT_SECRET en .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-2h}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      bot-engine:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BACKEND_URL: ${PUBLIC_BACKEND_URL:-http://localhost:3001}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Definir NEXTAUTH_SECRET en .env}
      NEXTAUTH_URL: ${PUBLIC_FRONTEND_URL:-http://localhost:3000}
      NEXT_PUBLIC_BACKEND_URL: ${PUBLIC_BACKEND_URL:-http://localhost:3001}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  tradinghub_postgres_data:
