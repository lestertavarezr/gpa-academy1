# Cloudflare Worker: serves dist/web as static assets and the /api/v1 backend on the same origin.
# Production deploys run scripts/deploy.mjs (GitHub Actions), which fills in database_id and the secrets.
name = "neuroscan"
main = "worker/src/index.js"
compatibility_date = "2026-09-01"

[assets]
directory = "./dist/web"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "neuroscan"
database_id = "00000000-0000-0000-0000-000000000000" # set at deploy time by scripts/deploy.mjs
migrations_dir = "worker/migrations"

# Daily study reminders (Web Push) are evaluated every 15 minutes in each learner's timezone.
[triggers]
crons = ["*/15 * * * *"]

# Abuse protection for the unauthenticated endpoints (account creation, pairing claim, admin).
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[vars]
# Contact the push services can use about this sender; the deploy overrides it with the
# NEUROSCAN_CONTACT_EMAIL repository variable when set.
VAPID_SUBJECT = "mailto:soporte@example.com"
# Extra origins allowed to call the API cross-origin, comma separated (e.g. the LMS domain).
ALLOWED_ORIGINS = ""
# Pushes per cron run; 25 keeps the free plan's subrequest limit. Raise on the paid plan.
MAX_PUSH_PER_RUN = "25"

# Secrets (never commit them), managed by scripts/deploy.mjs:
#   ADMIN_TOKEN                          from the NEUROSCAN_ADMIN_TOKEN GitHub secret
#   VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY  generated once inside Cloudflare if missing

[observability]
enabled = true
