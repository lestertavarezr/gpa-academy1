# Cloudflare Worker: serves dist/web as static assets and the /api/v1 backend on the same origin.
# First-time setup is described in README.md ("Despliegue en Cloudflare").
name = "neuroscan"
main = "worker/src/index.js"
compatibility_date = "2026-09-01"

[assets]
directory = "./dist/web"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "neuroscan"
database_id = "00000000-0000-0000-0000-000000000000" # replace with the id printed by `wrangler d1 create neuroscan`
migrations_dir = "worker/migrations"

# Daily study reminders (Web Push) are evaluated every 15 minutes in each learner's timezone.
[triggers]
crons = ["*/15 * * * *"]

# Abuse protection for the unauthenticated endpoints (account creation, pairing claim, admin).
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[vars]
# Contact the push services can use about this sender. Replace with a real mailbox you monitor.
VAPID_SUBJECT = "mailto:soporte@example.com"
# Public half of the VAPID key pair (`npm run vapid:generate`). The private half is a secret.
VAPID_PUBLIC_KEY = ""
# Extra origins allowed to call the API cross-origin, comma separated (e.g. the LMS domain).
ALLOWED_ORIGINS = ""
# Pushes per cron run; 25 keeps the free plan's subrequest limit. Raise on the paid plan.
MAX_PUSH_PER_RUN = "25"

# Secrets (never commit them):
#   wrangler secret put VAPID_PRIVATE_KEY
#   wrangler secret put ADMIN_TOKEN

[observability]
enabled = true
