<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>NEURO//SCAN · Estadísticas</title>
<!--STYLES-->
</head>
<body>
<main class="admin">
  <header>
    <h1>NEURO//SCAN · Estadísticas del banco de casos</h1>
    <p>Datos agregados y anónimos. Úsalos para detectar preguntas ambiguas, distractores engañosos y conceptos mal calibrados.</p>
  </header>
  <form id="auth" class="auth">
    <label>Token de administración<input id="token" type="password" autocomplete="current-password" required></label>
    <label>Mínimo de intentos<input id="min" type="number" min="0" value="5"></label>
    <button type="submit">Cargar</button>
    <span id="status" role="status"></span>
  </form>
  <section id="summary" class="summary" hidden></section>
  <div class="table-wrap">
    <table id="table" hidden>
      <thead><tr>
        <th scope="col"><button type="button" data-sort="id">#</button></th>
        <th scope="col"><button type="button" data-sort="module">Módulo</button></th>
        <th scope="col">Caso</th>
        <th scope="col"><button type="button" data-sort="attempts">Intentos</button></th>
        <th scope="col"><button type="button" data-sort="accuracy">Acierto</button></th>
        <th scope="col"><button type="button" data-sort="overconfident">Error con confianza alta</button></th>
        <th scope="col">Distractor más elegido</th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </div>
</main>
<!--SCRIPTS-->
</body>
</html>
